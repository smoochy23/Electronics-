<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electronics Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#111a22;--mut:#5d6872;--line:#d9ddd8;--acc:#0a4dff;--onacc:#fff;--hi:#ffd23f;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141a;--card:#17202a;--ink:#eef1f4;--mut:#9aa6b2;--line:#2a3541;--acc:#6b95ff;--onacc:#0e141a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e141a;--card:#17202a;--ink:#eef1f4;--mut:#9aa6b2;--line:#2a3541;--acc:#6b95ff;--onacc:#0e141a;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:.6rem;align-items:center;padding:.7rem 1rem;background:var(--ink);color:var(--bg)}
.top .logo{font-weight:800;font-size:1.25rem;cursor:pointer;white-space:nowrap}
.top input{flex:1;min-width:0;padding:.55rem .8rem;border-radius:8px;border:0;background:var(--bg);color:var(--ink)}
.top button{background:var(--hi);color:#111;border:0;border-radius:8px;padding:.5rem .8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.top #adm{background:transparent;color:var(--bg);border:1px solid var(--mut)}
main{max-width:1000px;margin:0 auto;padding:1rem}
h1{font-size:clamp(1.6rem,5vw,2.4rem);margin:.4rem 0;line-height:1.1;font-weight:800}
h2{margin:.2rem 0 .8rem;font-size:1.3rem}
.sub{color:var(--mut);margin:0 0 1rem}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.8rem}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:.35rem .9rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1;background:var(--line);display:grid;place-items:center;font-size:3.2rem;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.body{padding:.7rem;display:flex;flex-direction:column;gap:.25rem;flex:1}
.name{font-weight:600}
.price{font-weight:800;font-size:1.1rem}
.desc{color:var(--mut);font-size:.85rem}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:.6rem 1rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.body .btn{margin-top:auto}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:.8rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
.row .pic{width:64px;height:64px;font-size:1.8rem;border-radius:8px;flex:none;aspect-ratio:auto}
.row .grow{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:.4rem}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
.tot{display:flex;justify-content:space-between;padding:.2rem 0}
.tot.big{font-weight:800;font-size:1.2rem;border-top:1px solid var(--line);margin-top:.4rem;padding-top:.6rem}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .2rem}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem;border:1px solid var(--line);border-radius:8px;margin-top:.5rem;font-weight:400}
.opt input{width:auto;margin-top:.25rem}
.note{background:var(--hi);color:#111;border-radius:8px;padding:.7rem .9rem;margin:.8rem 0}
.empty{text-align:center;color:var(--mut);padding:2rem 0}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.tag{font-size:.8rem;color:var(--bad);font-weight:600}
footer{max-width:1000px;margin:1rem auto 2rem;padding:1rem;color:var(--mut);font-size:.9rem;border-top:1px solid var(--line)}
footer a{color:var(--acc);font-weight:600}
.link{background:none;border:0;color:var(--acc);cursor:pointer;padding:0;text-decoration:underline}
</style>
</head>
<body>
<header class="top">
  <span class="logo" id="shop" data-act="home" tabindex="0"></span>
  <input id="search" type="search" placeholder="Search products" aria-label="Search products">
  <button data-act="cart" aria-label="Open cart">Cart <span id="cc"></span></button>
  <button id="adm" data-act="admin" hidden>Manage</button>
</header>
<main id="app"></main>
<footer>
  <div>Customer care: <a id="tel" href="#"></a></div>
  <div><button class="link" data-act="orders">My orders</button></div>
</footer>

<script type="application/json" id="data">{"name":"My Electronics","tagline":"Phones, audio and accessories delivered to your door.","cur":"KSh","fee":300,"phone":"0111909865","paybill":"542542","acct":"02308979546150","next":5,"products":[{"id":1,"name":"Smartphone 128GB","price":18500,"cat":"Phones","stock":5,"desc":"Sample item. Edit or delete me in Manage.","img":"","icon":"📱"},{"id":2,"name":"Wireless Earbuds","price":2800,"cat":"Audio","stock":12,"desc":"Sample item. Bluetooth, charging case.","img":"","icon":"🎧"},{"id":3,"name":"Smart Watch","price":4500,"cat":"Wearables","stock":7,"desc":"Sample item. Heart-rate and sleep tracking.","img":"","icon":"⌚"},{"id":4,"name":"20,000mAh Power Bank","price":2200,"cat":"Accessories","stock":0,"desc":"Sample item. Fast charging.","img":"","icon":"🔋"}]}</script>

<script>
let D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let cart=load('cart',{}),orders=load('orders',[]),view='shop',q='',cat='All',isOwner=false,editing=null,imgData='',lastOrder=null,pay='send';
const money=n=>D.cur+' '+Number(n||0).toLocaleString();
const prod=id=>D.products.find(p=>p.id==id);
const lines=()=>Object.keys(cart).map(id=>({p:prod(id),n:cart[id]})).filter(l=>l.p&&l.n>0);
const sub=()=>lines().reduce((s,l)=>s+l.p.price*l.n,0);
const count=()=>lines().reduce((s,l)=>s+l.n,0);
const pic=p=>`<div class="pic">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}">`:esc(p.icon||'📦')}</div>`;

function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
  $('#shop').textContent=D.name;document.title=D.name;
  const t=$('#tel');t.textContent=D.phone;t.href='tel:'+D.phone;
  $('#cc').textContent=count()?'('+count()+')':'';
  $('#adm').hidden=!isOwner;
  const a=$('#app');
  a.innerHTML={shop:shopV,cart:cartV,checkout:checkV,done:doneV,orders:ordersV,admin:adminV}[view]();
}

function shopV(){
  const cats=['All',...new Set(D.products.map(p=>p.cat).filter(Boolean))];
  const list=D.products.filter(p=>(cat==='All'||p.cat===cat)&&(p.name+' '+(p.desc||'')).toLowerCase().includes(q.toLowerCase()));
  return `<h1>${esc(D.name)}</h1><p class="sub">${esc(D.tagline)}</p>
  <div class="chips">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${list.length?`<div class="grid">${list.map(p=>`<div class="card">${pic(p)}<div class="body"><div class="name">${esc(p.name)}</div><div class="price">${money(p.price)}</div><div class="desc">${esc(p.desc)}</div>${p.stock>0?`<button class="btn" data-act="add" data-id="${p.id}">Add to cart</button>`:`<span class="tag">Sold out</span>`}</div></div>`).join('')}</div>`:`<div class="empty">No products match. ${isOwner?'Add some under Manage.':'Check back soon.'}</div>`}`;
}

function cartV(){
  const L=lines();
  if(!L.length)return `<h2>Your cart</h2><div class="empty">Your cart is empty.<div class="acts" style="justify-content:center"><button class="btn" data-act="home">Browse products</button></div></div>`;
  return `<h2>Your cart</h2><div class="panel">${L.map(l=>`<div class="row">${pic(l.p)}<div class="grow"><div class="name">${esc(l.p.name)}</div><div>${money(l.p.price)}</div><button class="link" data-act="rm" data-id="${l.p.id}">Remove</button></div><div class="qty"><button data-act="dec" data-id="${l.p.id}" aria-label="Fewer">−</button><span>${l.n}</span><button data-act="add" data-id="${l.p.id}" aria-label="More">+</button></div></div>`).join('')}
  <div class="tot"><span>Items</span><span>${money(sub())}</span></div><div class="tot"><span>Delivery</span><span>${money(D.fee)}</span></div><div class="tot big"><span>Total</span><span>${money(sub()+Number(D.fee))}</span></div></div>
  <div class="acts"><button class="btn" data-act="checkout">Checkout</button><button class="btn alt" data-act="home">Keep shopping</button></div>`;
}

function checkV(){
  if(!lines().length)return cartV();
  return `<h2>Checkout</h2><form id="co" class="panel">
  <label for="n">Full name</label><input id="n" name="name" required autocomplete="name">
  <label for="p">Phone number</label><input id="p" name="phone" type="tel" required autocomplete="tel">
  <label for="a">Delivery address</label><textarea id="a" name="addr" rows="3" required placeholder="Town, street, building, landmark"></textarea>
  <label for="no">Note (optional)</label><input id="no" name="note">
  <label>Payment</label>
  <label class="opt"><input type="radio" name="pay" value="send" ${pay==='send'?'checked':''}><span>Pay now by M-Pesa Paybill</span></label>
  <label class="opt"><input type="radio" name="pay" value="delivery" ${pay==='delivery'?'checked':''}><span>Pay on delivery</span></label>
  <div id="payinfo" class="note" ${pay==='send'?'':'hidden'}>
   <b>How to pay</b><br>M-Pesa menu, Lipa na M-Pesa, Pay Bill.<br>Business no: <b>${esc(D.paybill)}</b><br>Account no: <b>${esc(D.acct)}</b><br>Amount: <b>${money(sub()+Number(D.fee))}</b><br>Then enter the M-Pesa confirmation code from your SMS:
   <input name="code" maxlength="10" placeholder="e.g. SJK1A2B3C4" autocapitalize="characters" style="margin-top:.4rem;text-transform:uppercase"></div>
  <div class="tot big"><span>Total</span><span>${money(sub()+Number(D.fee))}</span></div>
  <div class="acts"><button class="btn" type="submit">Place order</button><button class="btn alt" type="button" data-act="cart">Back to cart</button></div></form>`;
}

function summary(o){
  return `Order ${o.id}\n`+o.items.map(i=>`${i.n} x ${i.name} (${money(i.price)})`).join('\n')+`\nDelivery: ${money(o.fee)}\nTotal: ${money(o.total)}\nName: ${o.name}\nPhone: ${o.phone}\nAddress: ${o.addr}`+(o.note?`\nNote: ${o.note}`:'')+`\nPayment: ${o.pay==='send'?'M-Pesa Paybill '+D.paybill+', account '+D.acct+', code '+o.code:'on delivery'}`;
}
function doneV(){
  const o=lastOrder;if(!o)return shopV();
  return `<h2>Order ${esc(o.id)} saved</h2><div class="note"><b>Last step:</b> send your order to the seller so it can be delivered. Tap Send order by SMS, or call ${esc(D.phone)}.</div>
  <div class="panel"><pre style="white-space:pre-wrap;margin:0;font:inherit">${esc(summary(o))}</pre></div>
  ${o.pay==='send'?`<div class="note">Payment code <b>${esc(o.code)}</b> recorded. The seller confirms it before delivery.</div>`:''}
  <div class="acts"><a class="btn" href="sms:${esc(D.phone)}?&body=${encodeURIComponent(summary(o))}">Send order by SMS</a><a class="btn alt" href="tel:${esc(D.phone)}">Call customer care</a><button class="btn alt" data-act="copy">Copy order</button><button class="btn alt" data-act="home">Continue shopping</button></div>`;
}
function ordersV(){
  return `<h2>My orders</h2><p class="sub">Saved on this device only.</p>`+(orders.length?orders.map(o=>`<div class="panel"><b>${esc(o.id)}</b> · ${esc(o.date)}<br>${o.items.map(i=>esc(i.n+' x '+i.name)).join(', ')}<br><b>${money(o.total)}</b><div class="acts"><button class="btn alt" data-act="view" data-id="${esc(o.id)}">View</button></div></div>`).join(''):'<div class="empty">No orders yet.</div>');
}

function adminV(){
  const e=editing&&prod(editing)||{name:'',price:'',cat:'',stock:1,desc:'',icon:'📦',img:''};
  if(editing===null||!prod(editing))imgData=imgData||'';
  return `<h2>Manage store</h2>
  <form id="set" class="panel"><b>Store settings</b>
  <label>Store name</label><input name="name" value="${esc(D.name)}"><label>Tagline</label><input name="tagline" value="${esc(D.tagline)}">
  <label>Currency label</label><input name="cur" value="${esc(D.cur)}"><label>Delivery fee</label><input name="fee" type="number" min="0" value="${esc(D.fee)}">
  <label>Customer care number</label><input name="phone" value="${esc(D.phone)}">
  <label>Paybill business number</label><input name="paybill" value="${esc(D.paybill)}"><label>Paybill account number</label><input name="acct" value="${esc(D.acct)}">
  <div class="acts"><button class="btn" type="submit">Save settings</button></div></form>
  <form id="pf" class="panel"><b>${editing&&prod(editing)?'Edit product':'Add product'}</b>
  <label>Name</label><input name="name" required value="${esc(e.name)}"><label>Price</label><input name="price" type="number" min="0" required value="${esc(e.price)}">
  <label>Category</label><input name="cat" value="${esc(e.cat)}" placeholder="Phones, Audio, TVs"><label>In stock</label><input name="stock" type="number" min="0" value="${esc(e.stock)}">
  <label>Description</label><textarea name="desc" rows="2">${esc(e.desc)}</textarea><label>Icon (shown when no photo)</label><input name="icon" value="${esc(e.icon)}">
  <label>Photo</label><input id="file" type="file" accept="image/*">${(imgData||e.img)?`<div class="pic" style="width:96px;margin-top:.5rem;border-radius:8px"><img src="${esc(imgData||e.img)}" alt=""></div>`:''}
  <div class="acts"><button class="btn" type="submit">${editing&&prod(editing)?'Save product':'Add product'}</button>${editing?'<button class="btn alt" type="button" data-act="newp">Cancel</button>':''}</div></form>
  <div class="panel"><b>Products (${D.products.length})</b>${D.products.map(p=>`<div class="row">${pic(p)}<div class="grow"><div class="name">${esc(p.name)}</div><div>${money(p.price)} · stock ${p.stock}</div></div><button class="btn alt" data-act="edit" data-id="${p.id}">Edit</button><button class="btn bad" data-act="del" data-id="${p.id}">Delete</button></div>`).join('')}</div>
  <div class="note">Changes are only visible to shoppers after you publish.</div>
  <div class="acts"><button class="btn" data-act="publish">Publish changes</button><button class="btn alt" data-act="home">View store</button></div>`;
}

function readImg(f){return new Promise(r=>{const i=new Image;i.onload=()=>{const s=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)})}

async function publish(){
  try{
    const a=await claude.use('artifact');
    if(!a){alert('Open this store from your Claude artifact link as the owner to publish.');return}
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
    c.querySelector('#app').innerHTML='';
    await a.publish('<!doctype html>\n'+c.outerHTML);
  }catch(e){alert('Could not publish: '+((e&&(e.code||e.message))||'unknown error'))}
}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==='home')go('shop');
  else if(act==='cart')go('cart');
  else if(act==='orders')go('orders');
  else if(act==='admin')go('admin');
  else if(act==='cat'){cat=b.dataset.v;render()}
  else if(act==='add'){const p=prod(id);if((cart[id]||0)<p.stock){cart[id]=(cart[id]||0)+1;save('cart',cart)}else alert('Only '+p.stock+' in stock.');render()}
  else if(act==='dec'){cart[id]=(cart[id]||0)-1;if(cart[id]<=0)delete cart[id];save('cart',cart);render()}
  else if(act==='rm'){delete cart[id];save('cart',cart);render()}
  else if(act==='checkout')go('checkout');
  else if(act==='view'){lastOrder=orders.find(o=>o.id===id);go('done')}
  else if(act==='copy'){try{await navigator.clipboard.writeText(summary(lastOrder));b.textContent='Copied'}catch(e){alert('Copy failed. Select the text and copy it.')}}
  else if(act==='edit'){editing=+id;imgData='';render();window.scrollTo(0,0)}
  else if(act==='newp'){editing=null;imgData='';render()}
  else if(act==='del'){if(confirm('Delete this product?')){D.products=D.products.filter(p=>p.id!=id);delete cart[id];render()}}
  else if(act==='publish')publish();
});
$('#search').addEventListener('input',e=>{q=e.target.value;if(view!=='shop')view='shop';render()});
$('#shop').addEventListener('keydown',e=>{if(e.key==='Enter')go('shop')});
document.addEventListener('change',async e=>{if(e.target.name==='pay'){pay=e.target.value;const pi=$('#payinfo');if(pi)pi.hidden=pay!=='send';return}if(e.target.id==='file'&&e.target.files[0]){imgData=await readImg(e.target.files[0]);const f=document.querySelector('#pf');const keep=new FormData(f);const cur=editing&&prod(editing);const t={name:keep.get('name'),price:keep.get('price'),cat:keep.get('cat'),stock:keep.get('stock'),desc:keep.get('desc'),icon:keep.get('icon')};render();const nf=document.querySelector('#pf');for(const k in t)nf.elements[k].value=t[k]}});
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target,fd=new FormData(f);
  if(f.id==='co'){
    pay=fd.get('pay');const L=lines();const code=(fd.get('code')||'').trim().toUpperCase();if(pay==='send'&&!/^[A-Z0-9]{10}$/.test(code)){alert('Enter the 10-character M-Pesa confirmation code from your payment SMS, or choose Pay on delivery.');return}
    const o={id:'ORD-'+Date.now().toString(36).toUpperCase(),date:new Date().toLocaleString(),items:L.map(l=>({n:l.n,name:l.p.name,price:l.p.price})),fee:Number(D.fee),total:sub()+Number(D.fee),name:fd.get('name'),phone:fd.get('phone'),addr:fd.get('addr'),note:fd.get('note'),pay,code};
    orders.unshift(o);save('orders',orders);lastOrder=o;cart={};save('cart',cart);go('done');
  }else if(f.id==='set'){
    D.name=fd.get('name')||D.name;D.tagline=fd.get('tagline');D.cur=fd.get('cur');D.fee=Number(fd.get('fee')||0);D.phone=fd.get('phone')||D.phone;D.paybill=fd.get('paybill')||D.paybill;D.acct=fd.get('acct')||D.acct;render();
  }else if(f.id==='pf'){
    const old=editing&&prod(editing);
    const p={id:old?old.id:D.next++,name:fd.get('name'),price:Number(fd.get('price')),cat:fd.get('cat').trim(),stock:Number(fd.get('stock')||0),desc:fd.get('desc'),icon:fd.get('icon')||'📦',img:imgData||(old?old.img:'')};
    if(old)D.products[D.products.indexOf(old)]=p;else D.products.push(p);
    editing=null;imgData='';render();
  }
});

render();
(async()=>{try{if(window.claude&&claude.use){const u=await claude.use('user');isOwner=!!(u&&u.isOwner());render()}}catch(e){}})();
</script>
</body>
</html>
